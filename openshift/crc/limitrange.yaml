apiVersion: v1
kind: LimitRange
metadata:
  name: mayabank-pega-default-limits
  namespace: mayabank-pega
  labels:
    app.kubernetes.io/part-of: mayabank-pega-solution-architecture
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: "1"
        memory: 2Gi
      min:
        cpu: 10m
        memory: 64Mi
      max:
        cpu: "8"
        memory: 16Gi
